  if (!start || !destination) {

    return;
  }

  let route = [];

  const isBarrierFree = routeMode === "barrierfree";


  // 9号館3階 → 931
  if (start === "9-3" && destination === "931") {

    route = [
      "9号館3階の現在地から出発します",
      "廊下を進みます",
      "931教室へ向かいます",
      "931教室に到着です！"
    ];

  }

  // 9号館3階 → 901
  else if (start === "9-3" && destination === "901") {

      "9号館3階から出発します",
      "階段またはエレベーターでB1階へ移動します",

        "エレベーターで8号館の入口階へ移動します",

        "エレベーターで目的の階へ移動します",
        "目的地に到着です！"
      ];

      route = [
        "現在地の階から8号館の入口へ向かいます",

  // トイレ情報

    console.log("現在地:", start, "トイレ情報:", toilet);

   const photoHTML = photos.map((photo, index) => {
  let toiletInfo = "";

  // 9号館3階：男子・女子を別々に表示

      toiletInfo += `

        <p>${toilet.multipurposeLocation || ""}</p>

toiletHTML = `

`;
