<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  margin: 0;
  padding: 16px;
  color: #f5f3ff;
  background:
    radial-gradient(circle at 15% 10%, #25477b 0, transparent 28%),
    radial-gradient(circle at 90% 35%, #29285c 0, transparent 30%),
    linear-gradient(160deg, #071329, #101e40 55%, #171633);
  min-height: 100vh;
}

.container {
  max-width: 600px;
  margin: auto;
}

.top-header {
  max-width: 600px;
  margin: 0 auto 28px;
  padding: 12px 0 20px;
  border-bottom: 1px solid rgba(224, 207, 164, 0.4);
}

.top-header h1 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 0;
  font-size: clamp(20px, 5.5vw, 30px);
  white-space: nowrap;
  color: #fff8e9;
  text-shadow: 0 0 18px rgba(125, 170, 255, 0.45);
}

.site-logo {
  width: 58px;
  height: 58px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 10px;
}

.page-title {
  margin: 0 0 24px;
  font-size: 25px;
  color: #fff2d5;
  text-shadow: 0 0 16px rgba(149, 180, 255, 0.45);
}

.step-box {
  background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.055));
  border: 1px solid rgba(205, 219, 255, 0.25);
  border-radius: 18px;
  padding: 18px;
  margin: 14px 0;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(8px);
}

.step-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 12px;
  color: #f6dca1;
}

select {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #b9c9eb;
  border-radius: 10px;
  background: #f8f9ff;
  color: #17213d;
}

button {
  width: 100%;
  padding: 16px;
  border: 1px solid #f1d49a;
  border-radius: 12px;
  background: linear-gradient(135deg, #e7d19b, #b9c9f7 55%, #8ca9e8);
  color: #111d3a;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 5px 18px rgba(104, 142, 220, 0.25);
  transition: transform 0.2s, filter 0.2s;
}

button:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

#routeResult {
  margin-top: 25px;
}

.route-summary,
.route-box {
  background: rgba(255, 255, 255, 0.96);
  color: #17213d;
  border: 1px solid #cbd7f0;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}

.route-summary p {
  margin: 8px 0;
  font-size: 16px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.route-summary p:first-child::before {
  content: "● ";
  color: #318b70;
}

.route-summary p:last-child::before {
  content: "● ";
  color: #c44e66;
}

.route-step {
  padding: 15px 0;
  border-bottom: 1px solid #e2e7f2;
}

.route-step:last-child {
  border-bottom: none;
}

.route-step h3 {
  display: inline-block;
  font-size: 15px;
  margin: 0 0 8px;
  padding: 6px 11px;
  border-radius: 7px;
  background: #e8edfb;
  color: #263e70;
}

.route-step p {
  line-height: 1.8;
  margin: 8px 0;
}

.route-photo {
  width: 220px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
  margin: 12px 0 16px;
  border-radius: 12px;
  border: 1px solid #d5dced;
  box-shadow: 0 4px 12px rgba(25, 40, 75, 0.14);
}

.route-arrow {
  text-align: center;
  font-size: 28px;
  color: #e6d19d;
  margin: 8px 0;
  font-weight: bold;
}

.toilet-info {
  margin-top: 20px;
  padding: 18px;
  color: #17213d;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid #cbd7f0;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}

.toilet-info h3 {
  margin-top: 0;
  color: #263e70;
}

.toilet-photo-item {
  margin-bottom: 18px;
}

.toilet-photo-item p {
  margin: 6px 0 12px;
  font-size: 15px;
  line-height: 1.7;
}

@media (max-width: 380px) {
  body {
    padding: 12px;
  }

  .site-logo {
    width: 48px;
    height: 48px;
  }

  .top-header h1 {
    gap: 7px;
    font-size: 20px;
  }

  .page-title {
    font-size: 22px;
  }

  .step-box {
    padding: 14px;
  }
}

  body {
  background-image:
    radial-gradient(circle, #fff4c7 1px, transparent 1.5px),
    radial-gradient(circle, #a9c9ff 1px, transparent 1.5px),
    radial-gradient(circle, #ffffff 1.5px, transparent 2px),
    radial-gradient(circle at 15% 20%, #25477b 0, transparent 28%),
    radial-gradient(circle at 90% 35%, #29285c 0, transparent 30%),
    linear-gradient(160deg, #071329, #101e40 55%, #171633);
  background-size:
    83px 97px,
    127px 113px,
    173px 151px,
    auto,
    auto,
    auto;
  background-position:
    10px 15px,
    45px 60px,
    80px 30px,
    center,
    center,
    center;
}
</style>
</head>

  <script>
    "use strict";

    const toilets = {
      "9-b1": {
        location: "9号館B1階 エレベーターを出て左側",
        male: true, female: true, multipurpose: false
      },
      "901": {
        location: "9号館B1階 エレベーターを出て左側",
        male: true, female: true, multipurpose: false
      },
      "9-1": {
        male: true,
        maleLocation: "9号館1階 エレベーターを出て左側",
        female: true,
        femaleLocation: "9号館1階 エレベーターを出て左側",
        multipurpose: true,
        multipurposeLocation: "9号館1階 エレベーターを出て右側"
      },
      "9-2": {
        location: "9号館2階 エレベーターを出て左側",
        male: true, female: true, multipurpose: false
      },
      "9-3": {
        male: true,
        maleLocation: "9号館3階 エレベーターを出て左側",
        female: true,
        femaleLocation: "9号館3階 エレベーターを出て右側",
        multipurpose: false
      },
      "9-4": {
        location: "9号館4階 エレベーターを出て左側",
        male: true, female: false, multipurpose: false
      },
      "9-5": {
        location: "9号館5階 エレベーターを出て右側",
        male: false, female: true, multipurpose: false
      },
      "8-1": {
        location: "8号館1階 自販機前",
        male: false, female: false, multipurpose: true,
        multipurposeLocation: "8号館1階 自販機前"
      },
      "8-2": { location: "8号館2階 教室前", male: true, female: true, multipurpose: false },
      "8-3": { location: "8号館3階 教室前", male: true, female: true, multipurpose: false },
      "8-4": { location: "8号館4階 教室前", male: true, female: true, multipurpose: false },
      "8-5": { location: "8号館5階 教室前", male: true, female: true, multipurpose: false },
      "8-6": { location: "8号館6階 教室前", male: true, female: true, multipurpose: false },
      "8-7": { location: "8号館7階 教室前", male: true, female: true, multipurpose: false }
    };

    const toiletPhotos = {
      "9-b1": ["9号館男女トイレ.jpeg"],
      "901": ["9号館男女トイレ.jpeg"],
      "9-1": ["9号館男女トイレ.jpeg", "9号館多目的トイレ.jpeg"],
      "9-2": ["9号館男女トイレ.jpeg"],
      "9-3": ["9号館男子トイレ.jpeg", "9号館女子トイレ.jpeg"],
      "9-4": ["9号館男子トイレ.jpeg"],
      "9-5": ["9号館女子トイレ.jpeg"],
      "8-1": ["8号館多目的トイレ.jpeg"],
      "8-2": ["8号館男女トイレ.jpeg"],
      "8-3": ["8号館男女トイレ.jpeg"],
      "8-4": ["8号館男女トイレ.jpeg"],
      "8-5": ["8号館男女トイレ.jpeg"],
      "8-6": ["8号館男女トイレ.jpeg"],
      "8-7": ["8号館男女トイレ.jpeg"]
    };

    function floorNumber(floor) {
      return floor === "B1階" ? 0 : Number(String(floor).replace("階", ""));
    }

    function getFloor(value) {
      if (value === "901") return "B1階";
      if (["9-1", "8-1"].includes(value)) return "1階";
      if (["9-2", "9-2-left", "9-2-right", "821"].includes(value)) return "2階";
      if (["9-3", "931", "932", "933", "934", "831", "832"].includes(value)) return "3階";
      if (["9-4", "942", "841-1", "841-2", "841-3"].includes(value)) return "4階";
      if (["9-5", "952", "953", "954", "851"].includes(value)) return "5階";
      if (value === "861") return "6階";
      if (["871", "872"].includes(value)) return "7階";
      return "1階";
    }

    function getBuilding(value) {
      return value.startsWith("8") ? "8" : "9";
    }

    function getToiletKey(value) {
      if (value === "901") return "901";
      if (["931", "932", "933", "934"].includes(value)) return "9-3";
      if (["941", "942"].includes(value)) return "9-4";
      if (["952", "953", "954"].includes(value)) return "9-5";
      if (["9-2-left", "9-2-right", "9-2"].includes(value)) return "9-2";
      if (value === "821") return "8-2";
      if (["831", "832"].includes(value)) return "8-3";
      if (["841-1", "841-2", "841-3"].includes(value)) return "8-4";
      if (value === "851") return "8-5";
      if (value === "861") return "8-6";
      if (["871", "872"].includes(value)) return "8-7";
      if (value === "9-1") return "9-1";
      if (value === "8-1") return "8-1";
      return value;
    }

    function addPhoto(route, text, photo) {
      route.push(`<p>${text}</p><img class="route-photo" src="./${photo}" alt="${text}">`);
    }

    function addEightBuildingStairs(route, fromFloor, toFloor) {
      const from = floorNumber(fromFloor);
      const to = floorNumber(toFloor);
      if (from === to) return;

      if (from < to) {
        const photo = from === 1
          ? "8号館 1階階段上がる.jpeg"
          : "8号館階段上へ.jpeg";
        addPhoto(route, `階段で${toFloor}まで上がります`, photo);
      } else {
        const photo = from === 7
          ? "8号館7階階段下へ.jpeg"
          : "8号館階段下へ.jpeg";
        addPhoto(route, `階段で${toFloor}まで下ります`, photo);
      }
    }

    function addNineBuildingStairs(route, fromFloor, toFloor, target) {
      const from = floorNumber(fromFloor);
      const to = floorNumber(toFloor);
      if (from === to) return;

      const side = ["931", "932", "9-2-left", "9-2"].includes(target)
        ? "左手側"
        : "右手側";

      let photo;

      if (from === 0 && to > from) {
        photo = side === "左手側"
          ? "9号館地下から上へ(左手側).jpeg"
          : "9号館地下から上へ(右手側).jpeg";
      } else if (from > to) {
        if (from === 5 && side === "右手側") {
          photo = "9号館5階階段下へ(右手側).jpeg";
        } else if (from === 4) {
          photo = "9号館4階階段下へ.jpeg";
        } else {
          photo = side === "左手側"
            ? "9号館左手階段下へ.jpeg"
            : "9号館右手階段下へ.jpeg";
        }
      } else {
        photo = side === "左手側"
          ? "9号館左手階段上へ.jpeg"
          : "9号館右手階段上へ.jpeg";
      }

      addPhoto(
        route,
        `階段で${toFloor}まで${from < to ? "上がります" : "下ります"}`,
        photo
      );
    }

    function makeToiletHTML(startValue) {
      const key = getToiletKey(startValue);
      const toilet = toilets[key];
      if (!toilet) return "";

      const photos = toiletPhotos[key] || [];
      let html = `<section class="toilet-info"><h3>🚻 最寄りのお手洗い</h3>`;

      photos.forEach(photo => {
        html += `<div class="toilet-photo-item">`;
        html += `<img class="route-photo" src="./${photo}" alt="お手洗いの写真">`;

        if (photo.includes("多目的")) {
          html += `<p>♿ 多目的トイレ：${toilet.multipurposeLocation || toilet.location || ""}</p>`;
        } else if (photo.includes("男子")) {
          if (toilet.male) {
            html += `<p>🚹 男子トイレ：${toilet.maleLocation || toilet.location || ""}</p>`;
          }
        } else if (photo.includes("女子")) {
          if (toilet.female) {
            html += `<p>🚺 女子トイレ：${toilet.femaleLocation || toilet.location || ""}</p>`;
          }
        } else {
          if (toilet.male) {
            html += `<p>🚹 男子トイレ：${toilet.maleLocation || toilet.location || ""}</p>`;
          }
          if (toilet.female) {
            html += `<p>🚺 女子トイレ：${toilet.femaleLocation || toilet.location || ""}</p>`;
          }
        }

        html += `</div>`;
      });

      html += `</section>`;
      return html;
    }

    function showRoute() {
      const startSelect = document.getElementById("start");
      const destinationSelect = document.getElementById("destination");
      const start = startSelect.value;
      const destination = destinationSelect.value;
      const routeMode = document.getElementById("routeMode").value;
      const result = document.getElementById("routeResult");
      const startName = startSelect.selectedOptions[0].text;
      const destinationName = destinationSelect.selectedOptions[0].text;

      if (!start || !destination) {
        alert("出発地と目的地を選んでね！");
        return;
      }

      if (start === destination && startName === destinationName) {
  alert("出発地と目的地が同じだよ。別の場所を選んでね！");
  return;
}

      const isBarrierFree = routeMode === "barrierfree";
      const startBuilding = getBuilding(start);
      const destBuilding = getBuilding(destination);
      const startFloor = getFloor(start);
      const destFloor = getFloor(destination);
      const route = [];

      if (startBuilding !== destBuilding) {
        route.push(`<p>${startName}（${startFloor}）から${startBuilding}号館の入口へ向かいます。</p>`);

        if (isBarrierFree) {
          route.push("<p>エレベーターで1階まで移動します。</p>");
        } else if (startFloor !== "1階") {
          if (startBuilding === "8") {
            addEightBuildingStairs(route, startFloor, "1階");
          } else {
            addNineBuildingStairs(route, startFloor, "1階", start);
          }
        }

        if (startBuilding === "8") {
          addPhoto(route, "8号館の入口から外へ出ます", "8号館1階出る.jpeg");
          addPhoto(route, "外を右へ進みます", "外 右へ(８号館から).jpeg");
          addPhoto(route, "外を曲がります", "外 曲がる(8号館から).jpeg");
          addPhoto(route, "外を真っ直ぐ進みます", "外 真っ直ぐ(8号館から).jpeg");
          addPhoto(route, "9号館の入口へ向かいます", "外 9号館入る(8号館から).jpeg");
        } else {
          addPhoto(route, "9号館の入口から外へ出ます", "外 9号館から出る(9号館から).jpeg");
          addPhoto(route, "外を曲がります", "外 曲がる(9号館から).jpeg");
          addPhoto(route, "外を真っ直ぐ進みます", "外 真っ直ぐ(９号館から).jpeg");
          addPhoto(route, "8号館の入口へ向かいます", "外 8号館入り口入る(９号館から).jpeg");
        }

        route.push(`<p>${destBuilding}号館に到着しました。目的地へ向かいます。</p>`);

        if (destFloor !== "1階") {
          if (isBarrierFree) {
            route.push(`<p>エレベーターで${destFloor}まで移動します。</p>`);
          } else if (destBuilding === "8") {
            addEightBuildingStairs(route, "1階", destFloor);
          } else {
            addNineBuildingStairs(route, "1階", destFloor, destination);
          }
        }
      } else {
        if (startBuilding === "9" && start === "931" && destination === "934") {
          route.push("<p>931を出ます。</p>");
          addPhoto(route, "9号館3階の廊下を真っ直ぐ進みます", "9号館3階廊下真っ直ぐ(左手側).jpeg");
          addPhoto(route, "934の通路へ進みます", "9号館3階934通路へ.jpeg");
          addPhoto(route, "934の通路を進みます", "9号館3階934通路行く.jpeg");
        } else if (startBuilding === "9" && start === "934" && destination === "931") {
          route.push("<p>934を出ます。</p>");
          addPhoto(route, "934の通路を進みます", "9号館3階934通路行く.jpeg");
          addPhoto(route, "931の方向へ進みます", "9号館3階934通路へ.jpeg");
          addPhoto(route, "廊下を進みます", "9号館3階廊下真っ直ぐ(左手側).jpeg");
        } else {
          if (startFloor !== destFloor) {
            if (isBarrierFree) {
              route.push(`<p>エレベーターで${destFloor}まで移動します。</p>`);
            } else if (startBuilding === "8") {
              addEightBuildingStairs(route, startFloor, destFloor);
            } else {
              addNineBuildingStairs(route, startFloor, destFloor, destination);
            }
          }

          if (startBuilding === "8") {
            const directions = {
              "821": "真っ直ぐ",
              "831": "右",
              "832": "左",
              "851": "真っ直ぐ",
              "861": "真っ直ぐ",
              "871": "右",
              "872": "左"
            };

            let direction = directions[destination];

            if (start.startsWith("841-")) {
              if (destination === "841-1") {
                direction = start === "841-1" ? undefined : (start === "841-2" ? "左" : "右");
              } else if (destination === "841-2") {
                direction = start === "841-1" ? "右" : (start === "841-3" ? "左" : undefined);
              } else if (destination === "841-3") {
                direction = start === "841-1" ? "左" : (start === "841-2" ? "右" : undefined);
              }
            } else if (destination === "841-1") {
              direction = "右";
            } else if (destination === "841-2") {
              direction = "真っ直ぐ";
            } else if (destination === "841-3") {
              direction = "左";
            }

            if (direction) {
              const photo = direction === "右"
                ? "8号館教室出て右へ.jpeg"
                : direction === "左"
                  ? "8号館教室出て左へ.jpeg"
                  : "8号館教室出て真っ直ぐ.jpeg";

              addPhoto(route, `${destFloor}の廊下を${direction}へ進みます`, photo);
            }
          } else {
            if (["931", "932", "933", "934"].includes(destination)) {
              addPhoto(route, "3階の廊下を進みます", "9号館3階廊下真っ直ぐ(右手側).jpeg");
            } else if (destination === "942") {
              addPhoto(route, "4階の廊下を進みます", "9号館4階階段(右手側).jpeg");
              addPhoto(route, "942へ進みます", "9号館4階942へ(右手側).jpeg");
            } else if (["952", "953", "954"].includes(destination)) {
              addPhoto(route, "5階の廊下を進みます", "9号館5階階段から(左手側).jpeg");
            } else if (destination === "901") {
              addPhoto(route, "地下1階の廊下を進みます", "9号館地下廊下真っ直ぐ.jpeg");
            } else if (startFloor === destFloor) {
              route.push(`<p>${destFloor}の廊下を進み、${destinationName}へ向かいます。</p>`);
            }
          }
        }
      }

      route.push(`<p><strong>${destinationName}に到着です！</strong></p>`);

      result.innerHTML = `
        <div class="route-summary">
          <p>出発：${startName}</p>
          <p>到着：${destinationName}</p>
        </div>
        <div class="route-box">
          ${route.map((step, index) => `
            <div class="route-step">
              <h3>ステップ${index + 1}</h3>
              ${step}
            </div>
          `).join("")}
        </div>
        ${makeToiletHTML(start)}
      `;

      result.style.display = "block";
    }

    document.getElementById("showRouteButton").addEventListener("click", showRoute);
  </script>
</body>
</html>
